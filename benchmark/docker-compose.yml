# Benchmark stack. Taproot itself runs as a host binary (see run.sh) against the
# published Postgres port; the other contenders run here. Hasura is behind the
# `hasura` profile so the default run is Postgres + PostGraphile only.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bench
    ports:
      - "55434:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bench"]
      interval: 2s
      timeout: 3s
      retries: 60

  postgraphile:
    build: ./postgraphile
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/bench"
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  hasura:
    image: hasura/graphql-engine:v2.51.5
    environment:
      HASURA_GRAPHQL_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/bench"
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_DEV_MODE: "false"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["hasura"]
